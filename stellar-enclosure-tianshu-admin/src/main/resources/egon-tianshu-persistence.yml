egon:
  cola:
    component:
      mybatis-plus:
        enabled: true
        tenant-id:
          mdc-key: tenantId
          ignored-tables: [egon_cola_outbox_message, ddl_history]
        ddl:
          enabled: false
        lifecycle:
          history-read-statements: [top.egon.cola.component.tianshu.admin.dao.DdcAiResourceMapper.selectIncludingDeletedById]
          restore-statements: []
          statement-policies:
            "[top.egon.cola.component.tianshu.admin.dao.DdcSiVersionMapper.selectNextVersionNo]":
              scope: ALL_PARENT
              table: ddc_si_version
              key-column: resource_id
              parent-table: ddc_si_resource
            "[top.egon.cola.component.tianshu.admin.dao.DdcSiVersionMapper.selectHistoryByResourceIdAndVersionNo]":
              scope: ALL_PARENT
              table: ddc_si_version
              key-column: resource_id
              parent-table: ddc_si_resource
            "[top.egon.cola.component.tianshu.admin.dao.DdcSiVersionMapper.selectHistoryByIds]":
              scope: ID_BATCH
              table: ddc_si_version
              key-column: id
            "[top.egon.cola.component.tianshu.admin.dao.DdcAiOptimizationRunMapper.selectMaxRunNo]":
              scope: ALL_PARENT
              table: ddc_ai_optimization_run
              key-column: resource_id
              parent-table: ddc_ai_resource
        sharding:
          enabled: true
          mode: SHARDING
          config-style: STRATEGY
          transaction-default-type: LOCAL
          data-sources:
            - name: tianshu_0
              logical-name: tianshu_0
              role: PRIMARY
              driver-class-name: org.postgresql.Driver
              jdbc-url: "${TIANSHU_JDBC_URL:${spring.datasource.url}}"
              username: "${TIANSHU_DB_USERNAME:${spring.datasource.username}}"
              password: "${TIANSHU_DB_PASSWORD:${spring.datasource.password}}"
          tables:
            ddc_biz: { type: STANDARD_TENANT_ID }
            ddc_env: { type: STANDARD_TENANT_ID }
            ddc_app: { type: STANDARD_TENANT_ID }
            ddc_namespace: { type: STANDARD_TENANT_ID }
            ddc_namespace_env_app: { type: STANDARD_TENANT_ID }
            ddc_config_item: { type: STANDARD_TENANT_ID }
            ddc_config_version: { type: STANDARD_TENANT_ID }
            ddc_config_process_receipt: { type: STANDARD_TENANT_ID }
            ddc_config_workload_observation: { type: STANDARD_TENANT_ID }
            ddc_service_observation: { type: STANDARD_TENANT_ID }
            ddc_config_boot_binding_t0: { type: SINGLE, data-source: tianshu_0, schema: public }
            ddc_publish_task: { type: STANDARD_TENANT_ID }
            ddc_publish_ack: { type: STANDARD_TENANT_ID }
            ddc_instance: { type: STANDARD_TENANT_ID }
            ddc_operation_log: { type: STANDARD_TENANT_ID }
            ddc_ai_resource: { type: STANDARD_TENANT_ID }
            ddc_i18n_page: { type: STANDARD_TENANT_ID }
            ddc_metadata_scope: { type: STANDARD_TENANT_ID }
            ddc_source_import_grant: { type: STANDARD_TENANT_ID }
            ddc_i18n_source_version: { type: STANDARD_TENANT_ID }
            ddc_resource_metadata_projection: { type: STANDARD_TENANT_ID }
            ddc_i18n_source_message: { type: STANDARD_TENANT_ID }
            ddc_i18n_import_receipt: { type: STANDARD_TENANT_ID }
            ddc_catalog_activation_projection: { type: STANDARD_TENANT_ID }
            ddc_catalog_activation_producer: { type: STANDARD_TENANT_ID }
            ddc_i18n_published_override: { type: STANDARD_TENANT_ID }
            ddc_list_definition: { type: STANDARD_TENANT_ID }
            ddc_list_template: { type: STANDARD_TENANT_ID }
            ddc_list_template_column: { type: STANDARD_TENANT_ID }
            ddc_list_selection: { type: STANDARD_TENANT_ID }
            ddc_ai_version: { type: STANDARD_TENANT_ID }
            ddc_ai_draft_node: { type: STANDARD_TENANT_ID }
            ddc_ai_version_node: { type: STANDARD_TENANT_ID }
            ddc_ai_publication: { type: STANDARD_TENANT_ID }
            ddc_ai_usage_feedback: { type: STANDARD_TENANT_ID }
            ddc_ai_optimization_policy: { type: STANDARD_TENANT_ID }
            ddc_ai_optimization_run: { type: STANDARD_TENANT_ID }
            ddc_si_resource: { type: STANDARD_TENANT_ID }
            ddc_si_version: { type: STANDARD_TENANT_ID }
            ddc_si_binding: { type: STANDARD_TENANT_ID }
            ddc_si_reference: { type: STANDARD_TENANT_ID }
            ddc_si_embedding_chunk: { type: STANDARD_TENANT_ID }
            egon_cola_outbox_message: { type: SINGLE, data-source: tianshu_0, schema: egon_outbox }
            ddl_history: { type: SINGLE, data-source: tianshu_0, schema: egon_outbox }
        operation-log:
          enabled: "${TIANSHU_OPERATION_LOG_ENABLED:false}"
          write-mode: OUTBOX
          source-service: tianshu-admin
          target:
            enabled: "${TIANSHU_OPERATION_LOG_TARGET_ENABLED:false}"
            max-age: "${TIANSHU_OPERATION_LOG_MAX_AGE:}"
            transaction-timeout: "${TIANSHU_OPERATION_LOG_TARGET_TRANSACTION_TIMEOUT:5s}"
            ddl:
              enabled: "${TIANSHU_OPERATION_LOG_DDL_ENABLED:false}"
              auto-migrate: "${TIANSHU_OPERATION_LOG_AUTO_MIGRATE:false}"
            data-sources:
              - name: tianshu_audit_0_primary
                logical-name: tianshu_audit_0
                role: PRIMARY
                driver-class-name: org.postgresql.Driver
                jdbc-url: "${TIANSHU_OPERATION_LOG_SHARD_0_PRIMARY_JDBC_URL:}"
                username: "${TIANSHU_OPERATION_LOG_SHARD_0_PRIMARY_USERNAME:}"
                password: "${TIANSHU_OPERATION_LOG_SHARD_0_PRIMARY_PASSWORD:}"
              - name: tianshu_audit_0_replica
                logical-name: tianshu_audit_0
                role: REPLICA
                driver-class-name: org.postgresql.Driver
                jdbc-url: "${TIANSHU_OPERATION_LOG_SHARD_0_REPLICA_JDBC_URL:}"
                username: "${TIANSHU_OPERATION_LOG_SHARD_0_REPLICA_USERNAME:}"
                password: "${TIANSHU_OPERATION_LOG_SHARD_0_REPLICA_PASSWORD:}"
              - name: tianshu_audit_1_primary
                logical-name: tianshu_audit_1
                role: PRIMARY
                driver-class-name: org.postgresql.Driver
                jdbc-url: "${TIANSHU_OPERATION_LOG_SHARD_1_PRIMARY_JDBC_URL:}"
                username: "${TIANSHU_OPERATION_LOG_SHARD_1_PRIMARY_USERNAME:}"
                password: "${TIANSHU_OPERATION_LOG_SHARD_1_PRIMARY_PASSWORD:}"
              - name: tianshu_audit_1_replica
                logical-name: tianshu_audit_1
                role: REPLICA
                driver-class-name: org.postgresql.Driver
                jdbc-url: "${TIANSHU_OPERATION_LOG_SHARD_1_REPLICA_JDBC_URL:}"
                username: "${TIANSHU_OPERATION_LOG_SHARD_1_REPLICA_USERNAME:}"
                password: "${TIANSHU_OPERATION_LOG_SHARD_1_REPLICA_PASSWORD:}"
      tianshu:
        admin:
          operation-log:
            http-origin: "${TIANSHU_OPERATION_LOG_HTTP_ORIGIN:}"
      transactional-outbox:
        storage:
          data-source-bean-name: dataSource
          transaction-manager-bean-name: transactionManager
          validate-schema: true
          mp:
            sql-session-factory-bean-name: sqlSessionFactory
            auto-initialize-ddl: false
            manifest-resource: db/egon-outbox-mp/manifest.json
