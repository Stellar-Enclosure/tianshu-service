spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://127.0.0.1:5432/egon_tianshu_local}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver

egon:
  cola:
    platform:
      tianquan:
        shoubing:
          usage-observation:
            enabled: true
            receiver: TIANSHU
            fallback-issuer: ${TIANQUAN_SHOUBING_OAUTH_ISSUER}
            allow-local-plaintext: true
          trusted-issuers:
            tenant-a:
              issuer: ${TIANQUAN_SHOUBING_TENANT_A_ISSUER}
              jwks-uri: ${TIANQUAN_SHOUBING_TENANT_A_JWKS_URI}
              realm-key: ${TIANQUAN_SHOUBING_TENANT_A_REALM_KEY}
              realm-type: TENANT
              tenant-id: ${TIANQUAN_SHOUBING_TENANT_A_ID}
              status: ACTIVE
              trust-version: ${TIANQUAN_SHOUBING_TENANT_A_TRUST_VERSION}
            tenant-b:
              issuer: ${TIANQUAN_SHOUBING_TENANT_B_ISSUER}
              jwks-uri: ${TIANQUAN_SHOUBING_TENANT_B_JWKS_URI}
              realm-key: ${TIANQUAN_SHOUBING_TENANT_B_REALM_KEY}
              realm-type: TENANT
              tenant-id: ${TIANQUAN_SHOUBING_TENANT_B_ID}
              status: ACTIVE
              trust-version: ${TIANQUAN_SHOUBING_TENANT_B_TRUST_VERSION}
            platform:
              issuer: ${TIANQUAN_SHOUBING_PLATFORM_ISSUER}
              jwks-uri: ${TIANQUAN_SHOUBING_PLATFORM_JWKS_URI}
              realm-key: platform
              realm-type: PLATFORM
              status: ACTIVE
              trust-version: ${TIANQUAN_SHOUBING_PLATFORM_TRUST_VERSION}
          issuer: ${TIANQUAN_SHOUBING_OAUTH_ISSUER}
          jwk-set-uri: ${TIANQUAN_SHOUBING_JWK_SET_URI}
        jianshen:
          user-scope-policy:
            enabled: true
            permission-scopes:
              "TIANSHU_READ": ["TIANSHU_READ"]
              "TIANSHU_NAMESPACE_TEMPLATE_SYSTEM": ["TIANSHU_READ"]
              "TIANSHU_NAMESPACE_TEMPLATE_PERSONAL": ["TIANSHU_READ"]
              "TIANSHU_NAMESPACE_EXPORT": ["TIANSHU_READ"]
              "TIANSHU_I18N_READ": ["TIANSHU_I18N_READ"]
              "TIANSHU_WRITE": ["TIANSHU_WRITE"]
              "TIANSHU_PUBLISH": ["TIANSHU_PUBLISH"]
              "TIANSHU_CACHE": ["TIANSHU_CACHE"]
              "TIANSHU_AI_READ": ["TIANSHU_AI_READ"]
              "TIANSHU_AI_WRITE": ["TIANSHU_AI_WRITE"]
              "TIANSHU_AI_PUBLISH": ["TIANSHU_AI_WRITE"]
              "TIANSHU_SI_READ": ["TIANSHU_SI_READ"]
              "TIANSHU_SI_WRITE": ["TIANSHU_SI_WRITE"]
              "TIANSHU_SI_PUBLISH": ["TIANSHU_SI_WRITE"]
              "TIANSHU_SI_PROMOTE": ["TIANSHU_SI_WRITE"]
              "TIANSHU_SI_ARCHIVE": ["TIANSHU_SI_WRITE"]
              "TIANSHU_SI_BINDING_WRITE": ["TIANSHU_SI_WRITE"]
              "TIANSHU_SI_INDEX_MANAGE": ["TIANSHU_SI_READ"]
          authorization:
            endpoint: ${TIANQUAN_JIANSHEN_AUTHORIZATION_ENDPOINT:http://127.0.0.1:18130}
            service-token:
              enabled: ${TIANSHU_TIANQUAN_JIANSHEN_SERVICE_TOKEN_ENABLED:false}
              resource-uri: ${TIANSHU_TIANQUAN_JIANSHEN_SERVICE_TOKEN_RESOURCE_URI:}
              scopes: ${TIANSHU_TIANQUAN_JIANSHEN_SERVICE_TOKEN_SCOPES:}
    component:
      tianshu:
        si:
          vector-dimensions: ${TIANSHU_SI_VECTOR_DIMENSIONS:1536}
          rrf-k: ${TIANSHU_SI_RRF_K:60}
          embedding-timeout: ${TIANSHU_SI_EMBEDDING_TIMEOUT:1500ms}
          semantic-enabled: ${TIANSHU_SI_SEMANTIC_ENABLED:true}
          auto-publish-on-self-register: ${TIANSHU_SI_AUTO_PUBLISH_ON_SELF_REGISTER:false}
          allowed-promotion-transitions:
            - dev->test
            - test->staging
            - staging->prod
          index-executor:
            core-pool-size: ${TIANSHU_SI_INDEX_CORE_POOL_SIZE:2}
            max-pool-size: ${TIANSHU_SI_INDEX_MAX_POOL_SIZE:8}
            queue-capacity: ${TIANSHU_SI_INDEX_QUEUE_CAPACITY:256}
            await-termination: ${TIANSHU_SI_INDEX_AWAIT_TERMINATION:10s}
        admin:
          config-delivery:
            enabled: false
            api-server: https://127.0.0.1:1
            workload-audience: tianshu-config-test
            bindings: []
          ai:
            optimization:
              enabled: ${TIANSHU_AI_OPTIMIZATION_ENABLED:false}
              scan-interval: 60s
              run-lease: 10m
              max-concurrent-runs: 1
              sample-limit: 20
            judge:
              scan-interval: 30s
              batch-size: 50
              max-attempts: 3
              max-context-bytes: 16384
              lease: 5m
            model:
              base-url: "${TIANSHU_AI_MODEL_BASE_URL:http://127.0.0.1:18080}"
              resource-uri: "${TIANSHU_AI_MODEL_RESOURCE_URI:https://yuheng.local/llm}"
              registration-id: "${TIANSHU_AI_MODEL_REGISTRATION_ID:tianshu-ai}"
              app-id: "${TIANSHU_AI_MODEL_APP_ID:tianshu-admin}"
              scopes: "${TIANSHU_AI_MODEL_SCOPES:yuheng:llm:invoke}"
              connect-timeout: 3s
              read-timeout: 120s
              max-output-tokens: 8192
              temperature: 0.2
            feedback:
              retention: 30d
              retention-scan-interval: 1h
              max-batch: 100
              max-clock-skew: 5m
              max-input-excerpt-bytes: 8192
              max-output-excerpt-bytes: 32768
          redis:
            password: ${TIANSHU_REDIS_PASSWORD}
      transactional-outbox:
        enabled: true
        polling:
          enabled: true
          fixed-delay: 1s
          batch-size: 100
          concurrency: 4
        delivery:
          timeout: 10s
          lease-duration: 60s
          queue-capacity: 1000
        retry:
          max-attempts: 10
          initial-delay: 1s
          multiplier: 2.0
          max-delay: 5m
          jitter: 0.2
        payload:
          max-bytes: 8MB
          max-header-count: 64
          max-header-bytes: 16KB
      rpc:
        tls:
          development-plaintext: true
      yuheng:
        reporting:
          enabled: ${TIANSHU_YUHENG_REPORTING_ENABLED:false}
          env: local
          namespace: default
          application-code: tianshu
          artifact-version: local

management.endpoint.health.group.readiness.include: ["readinessState", "ddcAuditReadiness"]
