# Opt in explicitly after provisioning the tenant SERVICE registration and its exact SI read grant.
# Canonical resource identity remains HTTPS; the fixed internal native RPC listener uses h2c.
egon:
  cola:
    platform:
      tianquan:
        shoubing:
          rpc:
            enabled: true
            consumer:
              enabled: false
            provider:
              enabled: true
              methods:
                "[egon.tianshu.v1.DdcSiResourceGrpcService/ResolveSiResource]":
                  required: true
                  principal-kind: SERVICE
                  scope-context: TENANT
                  expected-resource-uri: ${TIANSHU_RESOURCE_URI}
                  required-scopes: ["${TIANSHU_SI_CATALOG_READ_SCOPE}"]
                "[egon.tianshu.v1.DdcSiResourceGrpcService/ListSiCatalog]":
                  required: true
                  principal-kind: SERVICE
                  scope-context: TENANT
                  expected-resource-uri: ${TIANSHU_RESOURCE_URI}
                  required-scopes: ["${TIANSHU_SI_CATALOG_READ_SCOPE}"]
                "[egon.tianshu.v1.DdcSiResourceGrpcService/SemanticSearchSiResources]":
                  required: true
                  principal-kind: SERVICE
                  scope-context: TENANT
                  expected-resource-uri: ${TIANSHU_RESOURCE_URI}
                  required-scopes: ["${TIANSHU_SI_CATALOG_READ_SCOPE}"]
    component:
      rpc:
        enabled: true
        transport: h2c
        provider:
          enabled: true
          bind-address: 0.0.0.0
          port: ${TIANSHU_RPC_PORT:19080}
        consumer:
          enabled: false
      tianshu:
        admin:
          si:
            native-rpc:
              # Supply exact issuer/resource/client/tenant/source coordinates and per-method namespaces.
              # Register additionally requires an explicit deployed SERVICE/TENANT write method policy.
              bindings: []
