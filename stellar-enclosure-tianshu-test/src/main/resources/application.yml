# Local mode demonstrates native Spring @DdcValue defaults without contacting a control plane.
# Cloud mode must also supply SPRING_CONFIG_IMPORT=tianshu-baseline:/absolute/mount/baseline.json,
# egon.cola.component.tianshu.baseline.file and the exact baseline.scope / baseline.target pins.
# A missing verified baseline or SERVICE deployment identity makes enabled delivery fail startup.
spring:
  application:
    name: stellar-enclosure-tianshu-test

egon:
  cola:
    component:
      id:
        enabled: false
      tianshu:
        enabled: ${TIANSHU_ENABLED:false}
        tenant-id: ${TIANSHU_TENANT_ID:}
        delivery:
          enabled: ${TIANSHU_ENABLED:false}
          service-origin: ${TIANSHU_CONFIG_SERVICE_ORIGIN:http://tianshu-config.platform-system.svc.cluster.local}
          state-directory: ${TIANSHU_CONFIG_STATE_DIRECTORY:}
          workload-token-file: ${TIANSHU_WORKLOAD_TOKEN_FILE:/var/run/tianshu/identity/workload-token}
          pod-uid: ${TIANSHU_POD_UID:}
          registration-id: ${TIANSHU_CONFIG_REGISTRATION_ID:}
          app-id: ${TIANSHU_CONFIG_APP_ID:}
          identity-tenant-id: ${TIANSHU_IDENTITY_TENANT_ID:}
          expected-issuer: ${TIANSHU_CONFIG_EXPECTED_ISSUER:}
          canonical-audience: ${TIANSHU_CONFIG_CANONICAL_AUDIENCE:}
          request-timeout: 15s
          poll-interval: 30s
          max-stale: 5m
          allow-offline-start: false
